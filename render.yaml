services:

  # Backend API Service  
  - type: web
    name: sync-watch-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: frankfurt  # Move to Frankfurt region
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEBUG_WEBSOCKET
        value: true
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        value: postgresql://stay_sync_user:AFMgTRk9pSla15phS7T4vUUCfeX5UbgL@dpg-d2peglndiees73bt5lv0-a/stay_sync
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false  
      - key: YOUTUBE_API_KEY
        value: AIzaSyBGaoo7O9ABniAuWcm62T8ZKcH9D3mN8M4
      - key: FRONTEND_URL
        value: https://staysync.baranaytas.com

  # Frontend Static Site
  - type: web
    name: sync-watch-frontend
    env: static
    buildCommand: npm ci && npm run build --workspace=packages/shared-types && npm run build --workspace=web
    staticPublishPath: ./web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://staysync-api.baranaytas.com
      - key: VITE_ENABLE_GUEST_LOGIN
        value: true
      - key: VITE_YOUTUBE_API_KEY
        sync: false

databases:
  - name: stay-sync
    databaseName: stay_sync
    user: stay_sync_user
    plan: free
    region: frankfurt