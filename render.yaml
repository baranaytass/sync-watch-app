services:
  # StaySync Backend API Service
  - type: web
    name: staysync-backend
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    repo: https://github.com/baranaytass/sync-watch-app
    rootDir: .
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    domains:
      - staysync-api.baranaytas.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://staysync.baranaytas.com

  # StaySync Frontend Static Site
  - type: web
    name: staysync-frontend
    runtime: static
    branch: main
    repo: https://github.com/baranaytass/sync-watch-app
    rootDir: .
    buildCommand: npm ci && npm run build --workspace=packages/shared-types && npm run build --workspace=web
    staticPublishPath: ./web/dist
    autoDeploy: true
    pullRequestPreviewsEnabled: false
    domains:
      - staysync.baranaytas.com
    envVars:
      - key: VITE_API_URL
        value: https://staysync-api.baranaytas.com
      - key: VITE_ENABLE_GUEST_LOGIN
        value: true
      - key: VITE_YOUTUBE_API_KEY
        sync: false

