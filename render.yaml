services:
  # StaySync Backend API Service
  - type: web
    name: staysync-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        value: postgresql://stay_sync_user:AFMgTRk9pSla15phS7T4vUUCfeX5UbgL@dpg-d2peglndiees73bt5lv0-a/stay_sync
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        value: AIzaSyBGaoo7O9ABniAuWcm62T8ZKcH9D3mN8M4
      - key: FRONTEND_URL
        value: https://staysync.baranaytas.com

  # StaySync Frontend Static Site
  - type: web
    name: staysync-frontend
    env: static
    buildCommand: VITE_API_URL=https://staysync-api.baranaytas.com VITE_ENABLE_GUEST_LOGIN=true npm ci && npm run build --workspace=packages/shared-types && npm run build --workspace=web
    staticPublishPath: ./web/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        value: https://staysync-api.baranaytas.com
      - key: VITE_ENABLE_GUEST_LOGIN
        value: true
      - key: VITE_YOUTUBE_API_KEY
        value: AIzaSyBGaoo7O9ABniAuWcm62T8ZKcH9D3mN8M4

databases:
  - name: staysync-database
    databaseName: stay_sync
    user: stay_sync_user
    plan: free
    region: frankfurt